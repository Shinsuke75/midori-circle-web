<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>みどりの工作室 サークル活動 管理</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="みどり管理">
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
  :root {
    --bg: #f6f4ee; --card: #ffffff; --ink: #2b2b26; --sub: #6b6a60;
    --green: #3f6b3a; --green-soft: #e6efe3; --line: #dedad0; --warn: #a4442f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    font-size: 17px; line-height: 1.6;
  }
  header { background: var(--green); color: #fff; padding: 14px 16px 0; }
  header .inner { max-width: 688px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 19px; letter-spacing: .04em; }
  header .who { margin: 2px 0 0; font-size: 14px; opacity: .9; }
  header .who button { display: inline; width: auto; margin: 0 0 0 8px; padding: 0 10px; font-size: 13px; font-weight: 400;
    border: 1px solid rgba(255,255,255,.7); background: transparent; color: #fff; border-radius: 999px; }
  nav { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; }
  nav button { flex: 0 0 auto; width: auto; margin: 0; padding: 8px 14px; font-size: 15px; font-weight: 700;
    border: none; border-radius: 10px 10px 0 0; background: rgba(255,255,255,.18); color: #fff; }
  nav button.on { background: var(--bg); color: var(--green); }
  nav .num { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 999px;
    background: var(--warn); color: #fff; font-size: 12px; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  .spinner { width: 36px; height: 36px; margin: 8px auto 12px; border: 4px solid #d9e3d3; border-top-color: var(--green); border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { padding: 12px 16px; border-radius: 10px; background: var(--card); border: 1px solid var(--green); margin-bottom: 16px; }
  .msg.err { border-color: var(--warn); color: var(--warn); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .card.canceled { opacity: .65; }
  .card.past { background: #fbfaf6; }
  h2 { font-size: 17px; margin: 0 0 10px; color: var(--green); }
  .date { font-size: 20px; font-weight: 700; margin: 0; }
  .meta { color: var(--sub); font-size: 15px; margin: 2px 0 0; }
  .badge { display: inline-block; font-size: 13px; font-weight: 700; padding: 1px 10px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; }
  .badge.stop { background: var(--warn); color: #fff; }
  .badge.off { background: #888; color: #fff; }
  .badge.soft { background: var(--green-soft); color: var(--green); }
  button { font-family: inherit; cursor: pointer; }
  .btn { display: inline-block; width: auto; margin: 6px 6px 0 0; padding: 8px 14px; font-size: 15px; font-weight: 700;
    border-radius: 10px; border: 2px solid var(--green); background: #fff; color: var(--green); }
  .btn.main { background: var(--green); color: #fff; }
  .btn.warn { border-color: var(--warn); color: var(--warn); }
  .btn.small { padding: 3px 10px; font-size: 13px; margin: 0 0 0 6px; border-width: 1px; }
  button:disabled { opacity: .5; cursor: default; }
  .people { list-style: none; margin: 10px 0 0; padding: 0; }
  .people li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
  .people li .n { flex: 1; }
  .people label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--sub); }
  input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--green); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  select, input[type=text], input[type=date], input[type=time], input[type=number], input[type=email] {
    font-family: inherit; font-size: 16px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink);
  }
  .form label { display: block; margin-top: 10px; font-size: 14px; color: var(--sub); }
  .form input, .form select, .form textarea { width: 100%; }
  textarea { font-family: inherit; font-size: 16px; line-height: 1.6; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); resize: vertical; }
  .form .two { display: flex; gap: 10px; }
  .form .two > div { flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 13px; color: var(--sub); font-weight: 400; }
  td.num { text-align: right; }
  .sub { color: var(--sub); font-size: 14px; }
  .center { text-align: center; padding: 40px 16px; }
  #signin { display: inline-block; margin-top: 16px; }
  details summary { cursor: pointer; color: var(--green); font-weight: 700; }
  @media (max-width: 520px) {
    .hide-sp { display: none; }
    .form .two { flex-direction: column; gap: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="inner">
    <h1>みどりの工作室 サークル活動 管理</h1>
    <p class="who" id="who"></p>
    <nav id="nav" hidden></nav>
  </div>
</header>
<main>
  <div id="message" class="msg" hidden></div>
  <div id="view"></div>
</main>
<script>
const CLIENT_ID = '79767718688-kkcivdeojo19iaktbs2he97200ulnlio.apps.googleusercontent.com';
const API_URL = 'https://script.google.com/macros/s/AKfycbxtI6yRRm6wFwVWxJaZZWr0A7KM1ohJ1hHwjubDS15ftzXF6ZZLXGheJjYkOlP4rYBk/exec';

const TABS = [
  { key: 'events', label: '開催日' },
  { key: 'members', label: '会員' },
  { key: 'pending', label: '新しい登録' },
  { key: 'mail', label: 'メール' },
  { key: 'admins', label: '管理者' }
];
// メールの書きかけ。送るのに失敗して画面を描き直しても消えないようにする
const drafts = { date: '', evSubject: '明日はみどりの工作室、サークル活動日です。', evBody: '', allSubject: '', allBody: '' };
let session = load('midori_admin_session');
let tab = load('midori_admin_tab') || 'events';
let data = null;
let busy = false;

function load(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
function save(k, v) { try { v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} }

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in attrs || {}) {
    const v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : String(c)); });
  return e;
}

function message(text, isErr, url) {
  const m = document.getElementById('message');
  if (!text) { m.hidden = true; return; }
  m.hidden = false;
  m.className = 'msg' + (isErr ? ' err' : '');
  m.textContent = text;
  // 新しいタブが開かなかったとき（スマホなど）のために、開くリンクも出す
  if (url) m.append(' ', el('a', { href: url, target: '_blank', rel: 'noopener' }, '開く'));
}

async function call(body) {
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return res.json();
}

// ---------- ログイン ----------

function showLoading(text) {
  document.getElementById('view').replaceChildren(el('div', { class: 'card center' },
    el('div', { class: 'spinner' }),
    el('p', {}, text),
    el('p', { class: 'sub' }, '10秒ほどかかることがあります。そのままお待ちください。')
  ));
}

function showLogin(note) {
  document.getElementById('nav').hidden = true;
  document.getElementById('who').textContent = '';
  const view = document.getElementById('view');
  view.replaceChildren(el('div', { class: 'card center' },
    el('p', {}, '管理者として登録したGoogleアカウントでログインしてください。'),
    note ? el('p', { class: 'sub' }, note) : null,
    el('div', { id: 'signin' })
  ));
  const draw = () => {
    if (!window.google || !google.accounts) { setTimeout(draw, 200); return; }
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, auto_select: false });
    google.accounts.id.renderButton(document.getElementById('signin'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'ja' });
  };
  draw();
}

async function onCredential(resp) {
  message('');
  showLoading('ログインしています…');
  try {
    const r = await call({ action: 'login', idToken: resp.credential });
    if (!r.ok) {
      showLogin();
      message(r.error === 'not_admin' ? r.email + ' は管理者として登録されていません。' : 'ログインできませんでした。もう一度お試しください。', true);
      return;
    }
    session = r.session;
    save('midori_admin_session', session);
    message('');
    await refresh();
  } catch (e) {
    showLogin();
    message('通信できませんでした。電波のよいところで、もう一度お試しください。', true);
  }
}

function logout() {
  session = null;
  save('midori_admin_session', null);
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
  message('');
  showLogin('ログアウトしました。');
}

// ---------- データのやりとり ----------

async function refresh() {
  try {
    const r = await call({ action: 'data', session: session });
    if (!r.ok) { session = null; save('midori_admin_session', null); showLogin('ログインの期限が切れました。もう一度ログインしてください。'); return; }
    data = r;
    render();
  } catch (e) {
    if (!data) showLogin();
    message('通信できませんでした。電波のよいところで、もう一度お試しください。', true);
  }
}

async function act(body, confirmText) {
  if (busy) return;
  if (confirmText && !confirm(confirmText)) return;
  busy = true;
  document.querySelectorAll('main button, main input, main select').forEach(b => b.disabled = true);
  message('処理しています…');
  try {
    body.session = session;
    const r = await call(body);
    if (r.error === 'login') { showLogin('ログインの期限が切れました。もう一度ログインしてください。'); message(''); return; }
    if (!r.ok) { message(r.msg || 'うまくいきませんでした。', true); busy = false; render(); return; }
    data = r;
    busy = false;
    render();
    message(r.msg || '', false, r.url);
    if (r.url) window.open(r.url, '_blank', 'noopener');
    return true;
  } catch (e) {
    message('通信できませんでした。電波のよいところで、もう一度お試しください。', true);
  } finally {
    busy = false;
    document.querySelectorAll('main button, main input, main select').forEach(b => b.disabled = false);
  }
}

// ---------- 表示 ----------

function render() {
  document.getElementById('who').replaceChildren(data.me + ' でログイン中', el('button', { onclick: logout }, 'ログアウト'));
  const nav = document.getElementById('nav');
  nav.hidden = false;
  nav.replaceChildren(...TABS.map(t => el('button', {
    class: t.key === tab ? 'on' : '',
    onclick: () => { tab = t.key; save('midori_admin_tab', tab); message(''); render(); }
  }, t.label, t.key === 'pending' && data.pending.length ? el('span', { class: 'num' }, data.pending.length) : null)));
  const view = document.getElementById('view');
  const draw = { events: viewEvents, members: viewMembers, pending: viewPending, mail: viewMail, admins: viewAdmins }[tab] || viewEvents;
  view.replaceChildren(...draw().filter(c => c != null && c !== false));
}

function memberOptions(exclude) {
  return data.members.filter(m => m.status === '有効' && !exclude.includes(m.id))
    .map(m => el('option', { value: m.id }, m.id + ' ' + m.nick));
}

function viewEvents() {
  const upcoming = data.events.filter(e => e.date >= data.today);
  const past = data.events.filter(e => e.date < data.today).reverse();
  return [
    ...(upcoming.length ? upcoming.map(eventCard) : [el('p', { class: 'sub' }, 'これからの開催日はありません。')]),
    eventForm(),
    past.length ? el('h2', { style: 'margin-top:24px' }, '過ぎた開催日（出席のチェック）') : null,
    ...past.map(eventCard),
    insuranceForm()
  ];
}

// 画面に出ていない古い開催日（3年以内）の、保険用の名簿を作る
function insuranceForm() {
  const d = el('input', { type: 'date' });
  return el('div', { class: 'card form' },
    el('h2', {}, '保険用の名簿（日付を指定）'),
    el('p', { class: 'sub', style: 'margin:0' }, 'その日の参加者の氏名・よみがな・生年月日・住所・電話番号などを、名簿の「保険用」シートに書き出します。押すたびに書き直します。3年前までの日を出せます。'),
    el('label', {}, '開催日'), d,
    el('button', { class: 'btn main', style: 'margin-top:14px', onclick: () => {
      if (!d.value) { message('日付を入れてください。', true); return; }
      act({ action: 'insurance', date: d.value });
    } }, '保険用の名簿を作る'));
}

function eventCard(ev) {
  const isPast = ev.date < data.today;
  const time = [ev.start && ev.end ? ev.start + '〜' + ev.end : ev.start, ev.place].filter(Boolean).join('　');
  const capa = ev.capacity ? '　定員 ' + ev.capacity + '人' : '';
  const list = el('ul', { class: 'people' }, ev.people.map(p => el('li', {},
    el('span', { class: 'n' }, p.nick, p.proxy ? el('span', { class: 'badge soft' }, '代理') : null,
      p.publicNote ? el('div', { class: 'sub', style: 'white-space:pre-wrap' }, 'みんなへ：' + p.publicNote) : null,
      p.note ? el('div', { class: 'sub', style: 'white-space:pre-wrap' }, '運営へ：' + p.note) : null),
    el('label', {}, el('input', { type: 'checkbox', checked: p.attended, onchange: e => act({ action: 'attend', date: ev.date, id: p.id, value: e.target.checked }) }), '出席'),
    isPast ? null : el('button', { class: 'btn small warn', onclick: () => act({ action: 'proxy', date: ev.date, id: p.id, op: 'cancel' }, p.nick + ' さんの ' + ev.label + ' の参加を取り消しますか？') }, '取消')
  )));
  const sel = el('select', {}, el('option', { value: '' }, '会員を選ぶ'), memberOptions(ev.people.map(p => p.id)));
  return el('div', { class: 'card' + (ev.canceled ? ' canceled' : '') + (isPast ? ' past' : '') },
    el('p', { class: 'date' }, ev.label, ev.canceled ? el('span', { class: 'badge stop' }, '中止') : null),
    el('p', { class: 'meta' }, time + capa),
    ev.note ? el('p', { class: 'meta' }, ev.note) : null,
    el('p', { class: 'meta' }, '参加 ' + ev.people.length + '人'),
    ev.people.length ? list : null,
    ev.waiting && ev.waiting.length ? el('p', { class: 'meta' }, 'キャンセル待ち（早い順）：' +
      ev.waiting.map(w => w.nick + (w.until ? '（連絡済み・' + w.until + 'まで返事待ち）' : '')).join('、')) : null,
    ...(ev.waiting || []).filter(w => w.note || w.publicNote).map(w => el('p', { class: 'sub', style: 'white-space:pre-wrap;margin:2px 0 0' },
      'キャンセル待ち ' + w.nick + '：' + [w.publicNote ? 'みんなへ：' + w.publicNote : '', w.note ? '運営へ：' + w.note : ''].filter(Boolean).join('　'))),
    isPast || ev.canceled ? null : el('div', { class: 'row' }, sel,
      el('button', { class: 'btn', onclick: () => {
        if (!sel.value) { message('代理で申し込む会員を選んでください。', true); return; }
        act({ action: 'proxy', date: ev.date, id: sel.value, op: 'join' });
      } }, '代理で申し込む')),
    ev.people.length ? el('div', { class: 'row' },
      el('button', { class: 'btn small', style: 'margin:0', onclick: () => act({ action: 'insurance', date: ev.date }) }, '保険用の名簿を作る')) : null,
    isPast ? null : el('div', { class: 'row' },
      el('button', { class: 'btn small', style: 'margin:0', onclick: () => fillEventForm(ev) }, '内容を直す'),
      ev.canceled
        ? el('button', { class: 'btn small', onclick: () => act({ action: 'cancelEvent', date: ev.date, value: false }, ev.label + ' の中止を取り消しますか？') }, '中止を取り消す')
        : el('button', { class: 'btn small warn', onclick: () => act({ action: 'cancelEvent', date: ev.date, value: true }, ev.label + ' を中止にしますか？参加者サイトに「中止」と出ます。') }, '中止にする'))
  );
}

function eventForm() {
  const f = el('div', { class: 'card form', id: 'eventForm' },
    el('h2', {}, '開催日を追加する'),
    el('p', { class: 'sub', style: 'margin:0' }, '同じ日付を入れると、その日の内容を書き換えます。'),
    el('div', { class: 'two' },
      el('div', {}, el('label', {}, '日付'), el('input', { type: 'date', id: 'f_date' })),
      el('div', {}, el('label', {}, '定員（なしは空欄）'), el('input', { type: 'number', id: 'f_capacity', min: '0', value: '12' }))),
    el('div', { class: 'two' },
      el('div', {}, el('label', {}, '開始'), el('input', { type: 'time', id: 'f_start', value: '10:00' })),
      el('div', {}, el('label', {}, '終了'), el('input', { type: 'time', id: 'f_end', value: '16:30' }))),
    el('label', {}, '場所'), el('input', { type: 'text', id: 'f_place', value: 'あいち海上の森センター 工作室' }),
    el('label', {}, '内容'), el('input', { type: 'text', id: 'f_note', value: 'みどりの工作室 サークル活動' }),
    el('button', { class: 'btn main', style: 'margin-top:14px', onclick: () => {
      const v = id => document.getElementById(id).value.trim();
      if (!v('f_date')) { message('日付を入れてください。', true); return; }
      act({ action: 'saveEvent', date: v('f_date'), start: v('f_start'), end: v('f_end'), place: v('f_place'), note: v('f_note'), capacity: v('f_capacity') });
    } }, '保存する'));
  return f;
}

function fillEventForm(ev) {
  const set = (id, v) => { document.getElementById(id).value = v || ''; };
  set('f_date', ev.date); set('f_start', ev.start); set('f_end', ev.end);
  set('f_place', ev.place); set('f_note', ev.note); set('f_capacity', ev.capacity || '');
  document.getElementById('eventForm').scrollIntoView({ behavior: 'smooth' });
  message('下の欄を直して「保存する」を押してください。');
}

function viewMembers() {
  const picked = new Set();
  const rows = data.members.map(m => {
    const off = m.status === '無効';
    return el('tr', {},
      el('td', {}, el('input', { type: 'checkbox', onchange: e => e.target.checked ? picked.add(m.id) : picked.delete(m.id), 'aria-label': m.nick + ' のカード' })),
      el('td', {}, el('strong', {}, m.nick), off ? el('span', { class: 'badge off' }, '無効') : null,
        el('div', { class: 'sub' }, m.id + '　' + m.name)),
      el('td', { class: 'num hide-sp' }, m.count + '回'),
      el('td', { class: 'hide-sp sub' }, m.issued),
      el('td', {},
        el('button', { class: 'btn small', onclick: () => {
          const nick = prompt(m.nick + ' さんの新しいニックネーム（20文字まで）。参加の予定表にも、この名前で出ます。', m.nick);
          if (nick === null || nick.trim() === '' || nick.trim() === m.nick) return;
          act({ action: 'setNick', id: m.id, nick: nick.trim() });
        } }, '名前を変える'),
        el('button', { class: 'btn small', onclick: () => act({ action: 'reissue', id: m.id },
          m.nick + ' さんのリンクを作り直して、メールで送りますか？今のリンクは使えなくなります。') }, '再発行'),
        off
          ? el('button', { class: 'btn small', onclick: () => act({ action: 'setStatus', id: m.id, status: '有効' }, m.nick + ' さんを有効に戻しますか？前と同じリンクがまた使えるようになります。') }, '有効に戻す')
          : el('button', { class: 'btn small warn', onclick: () => act({ action: 'setStatus', id: m.id, status: '無効' }, m.nick + ' さんを無効にしますか？リンクが使えなくなり、これからの申し込みも取り消されます。') }, '無効にする'))
    );
  });
  return [
    el('div', { class: 'card' },
      el('h2', {}, '会員（' + data.members.filter(m => m.status === '有効').length + '人）'),
      data.members.length ? el('table', {},
        el('thead', {}, el('tr', {}, el('th', {}, 'カード'), el('th', {}, '名前'), el('th', { class: 'hide-sp' }, '出席'), el('th', { class: 'hide-sp' }, 'リンク発行'), el('th', {}, ''))),
        el('tbody', {}, rows)) : el('p', { class: 'sub' }, 'まだ会員がいません。'),
      el('button', { class: 'btn main', style: 'margin-top:14px', onclick: () => {
        if (picked.size === 0) { message('カードを作る人の「カード」にチェックを入れてください。', true); return; }
        act({ action: 'makeCard', ids: [...picked] });
      } }, 'チェックした人のQRカードを作る'),
      el('p', { class: 'sub' }, 'カードは印刷用のGoogleドキュメントで、新しいタブで開きます。')),
    el('div', { class: 'card' },
      el('h2', {}, '名簿のスプレッドシートでやること'),
      el('p', { style: 'margin:0' }, '住所・電話番号・生年月日は、この画面には出しません。確かめるとき、登録内容を直すとき、1年参加がない人の住所・生年月日・連絡先を消すときは、', meiboLink(), 'を開いてください。'),
      el('p', { class: 'sub' }, '1年参加がない人は、先にこの画面で「無効」にしてから、名簿で消します。'))
  ];
}

function meiboLink() {
  return data.meiboUrl ? el('a', { href: data.meiboUrl, target: '_blank', rel: 'noopener' }, '名簿のスプレッドシート') : '名簿のスプレッドシート';
}

function viewPending() {
  if (!data.pending.length) return [el('p', { class: 'sub' }, '承認を待っている登録はありません。')];
  return data.pending.map(p => el('div', { class: 'card' },
    el('p', { class: 'date' }, p.nick),
    el('p', { class: 'meta' }, p.name + '　' + p.email),
    el('p', { class: 'meta' }, p.date + ' 登録'),
    p.note ? el('p', { class: 'meta', style: 'color:var(--warn)' }, p.note) : null,
    el('button', { class: 'btn main', onclick: () => act({ action: 'approve', row: p.row },
      p.nick + ' さんを承認して、参加用のリンクをメールで送りますか？') }, '承認してリンクを送る'),
    el('p', { class: 'sub' }, '住所や電話番号は、', meiboLink(), 'で確認できます。')
  ));
}

function viewMail() {
  const upcoming = data.events.filter(e => e.date >= data.today && !e.canceled);
  if (!upcoming.some(e => e.date === drafts.date)) drafts.date = upcoming.length ? upcoming[0].date : '';
  const field = (key, attrs) => el(attrs.rows ? 'textarea' : 'input', Object.assign({ oninput: e => { drafts[key] = e.target.value; } }, attrs), attrs.rows ? drafts[key] : null);
  const active = data.members.filter(m => m.status === '有効').length;

  const evSel = el('select', { onchange: e => { drafts.date = e.target.value; render(); } },
    upcoming.map(e => el('option', { value: e.date, selected: e.date === drafts.date }, e.label + '（参加 ' + e.people.length + '人）')));
  const ev = upcoming.find(e => e.date === drafts.date);

  return [
    el('div', { class: 'card form' },
      el('h2', {}, '開催日の参加者に送る'),
      el('p', { class: 'sub', style: 'margin:0' }, '前日のお知らせなどに使います。選んだ日に申し込んでいる人だけに届きます。'),
      upcoming.length ? [
        el('label', {}, '開催日'), evSel,
        el('label', {}, '件名'), field('evSubject', { type: 'text', value: drafts.evSubject }),
        el('label', {}, '本文'), field('evBody', { rows: 10 }),
        el('button', { class: 'btn main', style: 'margin-top:14px', onclick: async () => {
          if (!ev || ev.people.length === 0) { message('その日に申し込んでいる人がいません。', true); return; }
          const ok = await act({ action: 'mailEvent', date: ev.date, subject: drafts.evSubject, body: drafts.evBody },
            ev.label + ' の参加者 ' + ev.people.length + '人にメールを送りますか？');
          if (ok) { drafts.evBody = ''; render(); }
        } }, '参加者に送る')
      ] : el('p', { class: 'sub' }, 'これからの開催日がありません。')),
    el('div', { class: 'card form' },
      el('h2', {}, '会員全員に送る'),
      el('p', { class: 'sub', style: 'margin:0' }, '有効な会員 ' + active + '人に届きます。無効の人には届きません。'),
      el('label', {}, '件名'), field('allSubject', { type: 'text', value: drafts.allSubject }),
      el('label', {}, '本文'), field('allBody', { rows: 10 }),
      el('button', { class: 'btn main', style: 'margin-top:14px', onclick: async () => {
        const ok = await act({ action: 'mailAll', subject: drafts.allSubject, body: drafts.allBody }, '有効な会員 ' + active + '人にメールを送りますか？');
        if (ok) { drafts.allSubject = ''; drafts.allBody = ''; render(); }
      } }, '全員に送る')),
    el('p', { class: 'sub' }, 'メールは1人ずつ別々に届くので、ほかの人のアドレスは見えません。差出人は「みどりの工作室」です。申し込み・取り消しの確認メールは自動で届くので、ここで送る必要はありません。')
  ];
}

function viewAdmins() {
  const input = el('input', { type: 'email', placeholder: 'example@gmail.com', style: 'flex:1;min-width:200px' });
  return [el('div', { class: 'card' },
    el('h2', {}, '管理者'),
    el('ul', { class: 'people' }, data.admins.map(a => el('li', {},
      el('span', { class: 'n' }, a), a === data.me ? el('span', { class: 'sub' }, '（自分）')
        : el('button', { class: 'btn small warn', onclick: () => act({ action: 'removeAdmin', email: a }, a + ' を管理者から外しますか？') }, '外す')))),
    el('div', { class: 'row' }, input,
      el('button', { class: 'btn main', style: 'margin:0', onclick: () => act({ action: 'addAdmin', email: input.value.trim() }) }, '管理者に足す')),
    el('p', { class: 'sub' }, '足した人は、そのGoogleアカウントでこのページにログインできるようになります。'))];
}

// ---------- はじめ ----------

if (session) { showLoading('読み込んでいます…'); refresh(); } else showLogin();
</script>
</body>
</html>
