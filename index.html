<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>みどりの工作室 サークル活動</title>
<link rel="icon" href="icons/app/icon-192.png">
<link rel="apple-touch-icon" href="icons/app/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="みどりサークル">
<style>
  :root {
    --bg: #f6f4ee;
    --card: #ffffff;
    --ink: #2b2b26;
    --sub: #6b6a60;
    --green: #3f6b3a;
    --green-soft: #e6efe3;
    --line: #dedad0;
    --warn: #a4442f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    font-size: 18px;
    line-height: 1.6;
  }
  header {
    background: var(--green);
    color: #fff;
    padding: 16px 16px 14px;
  }
  header .inner { max-width: 528px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .04em; }
  header p { margin: 4px 0 0; font-size: 15px; opacity: .9; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  .msg { padding: 14px 16px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); margin-bottom: 16px; }
  .msg.err { border-color: var(--warn); color: var(--warn); }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card.joined { border: 2px solid var(--green); }
  .card.canceled { opacity: .6; }
  .date { font-size: 22px; font-weight: 700; margin: 0; }
  .meta { color: var(--sub); font-size: 16px; margin: 2px 0 0; }
  .note { margin: 8px 0 0; font-size: 16px; }
  .people-head { margin: 14px 0 6px; font-size: 15px; color: var(--sub); }
  .people { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .people li {
    background: var(--green-soft);
    border-radius: 999px;
    padding: 3px 12px 3px 8px;
    font-size: 16px;
    white-space: nowrap;
  }
  .people li.me { outline: 2px solid var(--green); }
  .none { color: var(--sub); font-size: 15px; }
  .badge {
    display: inline-block;
    font-size: 14px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 999px;
    margin-left: 8px;
    vertical-align: 3px;
  }
  .badge.ok { background: var(--green); color: #fff; }
  .badge.stop { background: var(--warn); color: #fff; }
  .badge.wait { background: #f3e6c8; color: #6b4e12; }
  .card.offered { border: 2px solid #c99a2e; }
  .offer-box { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: #fbf3df; font-size: 16px; }
  .wait-rule { margin: 12px 0 0; color: var(--sub); font-size: 14px; }
  .people.waiting li { opacity: .75; }
  button {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    font-size: 19px;
    font-weight: 700;
    border-radius: 12px;
    border: 2px solid var(--green);
    cursor: pointer;
    font-family: inherit;
  }
  button.join { background: var(--green); color: #fff; }
  button.cancel { background: #fff; color: var(--green); font-size: 16px; padding: 10px; }
  button:disabled { opacity: .5; cursor: default; }
  .hello { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .icon-btn {
    display: inline; width: auto; margin: 0; padding: 2px 10px;
    font-size: 13px; font-weight: 400; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.7); background: transparent; color: #fff;
  }
  .picker { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .picker[hidden] { display: none; }
  .picker button {
    width: 52px; height: 52px; margin: 0; padding: 0; font-size: 28px;
    background: #fff; border: 2px solid transparent; border-radius: 12px;
  }
  .picker button.current { border-color: #cfe0cb; }
  .picker button img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
  .picker .hint { flex-basis: 100%; margin: 4px 0 0; font-size: 13px; opacity: .9; }
  .sp-icon { width: 1.3em; height: 1.3em; border-radius: 50%; object-fit: cover; vertical-align: -0.25em; }
  .count { font-size: 13px; opacity: .85; }
  .note-label { display: block; margin: 14px 0 4px; font-size: 15px; color: var(--sub); }
  textarea.note-input {
    display: block; width: 100%; min-height: 64px; padding: 8px 10px; font-family: inherit; font-size: 16px;
    line-height: 1.5; border: 1px solid var(--line); border-radius: 10px; resize: vertical; background: #fff; color: var(--ink);
  }
  .my-note { margin: 10px 0 0; padding: 8px 12px; border-radius: 10px; background: var(--green-soft); font-size: 15px; white-space: pre-wrap; }
  .about summary { cursor: pointer; font-weight: 700; font-size: 17px; }
  .about h3 { margin: 14px 0 2px; font-size: 16px; }
  .about p { margin: 0; font-size: 16px; }
  .join-card { border: 2px solid var(--green); }
  .join-card h2 { margin: 0 0 6px; font-size: 19px; }
  .join-card p { margin: 0; font-size: 16px; }
  .join-card .sub { margin-top: 8px; color: var(--sub); font-size: 14px; }
  a.btn-link {
    display: block; margin-top: 14px; padding: 14px; text-align: center; text-decoration: none;
    font-size: 19px; font-weight: 700; border-radius: 12px; background: var(--green); color: #fff;
  }
  footer { text-align: center; color: var(--sub); font-size: 13px; padding: 8px 16px 32px; }
</style>
</head>
<body>
<header>
  <div class="inner">
    <h1>みどりの工作室 サークル活動</h1>
    <p id="hello" class="hello">読み込み中…</p>
    <div id="picker" class="picker" hidden></div>
  </div>
</header>
<main>
  <div id="message" class="msg" hidden></div>
  <div id="events"></div>
</main>
<footer>みどりの工作室</footer>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzIkuLTYXdUmitcjlAZFayt67q8Q4vD7xNmYVSpo0JZHNm2M1TR9MYS8iZ4IUN6Mw/exec';
  const ICONS = [
    '🌲', '🪵', '🍄', '🐿️', '🦉', '🌰', '🍃', '🐦', '🦔', '🌻',
    '🌳', '🍁', '🍂', '🌿', '🍀', '🌱', '🌸', '🌾', '🦫', '🦊',
    '🐻', '🦌', '🐗', '🐇', '🐸', '🐢', '🦋', '🐞', '🐝', '🪓',
    // 参加10回で選べる
    '🥄', '🪑', '🪚', '🔨', '🧺',
    // 参加30回で選べる
    '🏆', '👑', '🌟', '🎖️', '🐉'
  ];
  const SPECIAL = 'S';
  const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSeCcaE20H7CnhOoDyjMcLzeaV9r6P7noj4jPy6vACUUYGpi7Q/viewform';
  const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
  const WAIT_HOW = '空きが出たら、早く登録した人から順にメールでお知らせします。メールが届いたら、6時間のうちに参加のページで「参加する」か「参加しない」を選んでください。6時間たって返事がない場合は、次の人に移ります。お知らせは開催日の前日18時までです。';
  const WAIT_RULE = '定員に達した日は、キャンセル待ちに登録できます。' + WAIT_HOW;
  const ERRORS = {
    invalid_link: 'このリンクは使えません。運営の人に新しいリンクをもらってください。',
    full: '定員に達したため、参加できませんでした。キャンセル待ちに登録できます。',
    not_full: '空きがあるので、そのまま申し込めます。',
    wait_closed: 'キャンセル待ちの受付は、開催日の前日18時で終わりました。',
    canceled: 'この日は中止になりました。',
    past: 'この日はもう終わっています。',
    no_event: 'この日の予定が見つかりません。',
    busy: '混み合っています。少し待ってから、もう一度押してください。',
    bad_request: 'うまく送れませんでした。もう一度開き直してください。'
  };

  const token = getToken();

  function getToken() {
    const m = location.hash.match(/t=([0-9a-f]{32,128})/);
    if (m) {
      try { localStorage.setItem('midori_token', m[1]); } catch (e) {}
      return m[1];
    }
    try { return localStorage.getItem('midori_token'); } catch (e) { return null; }
  }

  function showMessage(text, isError) {
    const el = document.getElementById('message');
    el.textContent = text;
    el.className = 'msg' + (isError ? ' err' : '');
    el.hidden = !text;
  }

  async function call(body) {
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(Object.assign({ token: token }, body)) });
    return res.json();
  }

  function dateLabel(key) {
    const [y, m, d] = key.split('-').map(Number);
    const w = new Date(y, m - 1, d).getDay();
    return m + '月' + d + '日（' + WEEK[w] + '）';
  }

  function icon(n) { return ICONS[(n - 1) % ICONS.length] || ICONS[0]; }

  // 絵柄（文字）か、特別アイコン（画像）を返す
  function iconNode(n, special) {
    if (n === SPECIAL && special) {
      const img = document.createElement('img');
      img.className = 'sp-icon';
      img.src = 'icons/' + special;
      img.alt = '';
      return img;
    }
    const span = document.createElement('span');
    span.textContent = icon(n);
    return span;
  }

  // 活動の説明（Peatixの案内と同じ内容）。登録前の人には開いた状態で、会員には閉じた状態で出す
  function aboutCard(open) {
    const card = document.createElement('section');
    card.className = 'card about';
    const d = document.createElement('details');
    d.open = !!open;
    const sum = document.createElement('summary');
    sum.textContent = '活動について（参加費・持ち物・キャンセル）';
    d.appendChild(sum);
    const items = [
      ['どんな活動？', 'グリーンウッドワークを楽しむサークル活動です。先生はいませんが、経験者が教え手となり作り方を伝えたり、みんなで作り方を考えたり。それぞれが作りたいものを自由に作る、そんな活動を目指しています。'],
      ['材料と道具', '材料は、あいち海上の森から出てくる、風倒木・支障木・間伐材などの生木が使えます。工作室には、作業台と多少の工具、ナイフ・斧はありますが、基本的には自分の道具は自分でご用意ください。'],
      ['時間', '10:00〜16:30。工作室は9時から開錠しますが、10時をめどにお集まりください。途中の早退も自由です。'],
      ['参加費', '1,500円（会場借用料、傷害保険料含む）。当日、現地で現金またはPayPayでお支払いください。'],
      ['キャンセル', 'なるべく早くお知らせください。急病などのやむを得ない場合を除き、当日のキャンセルは全額のお支払いをお願いいたします。'],
      ['キャンセル待ち', WAIT_RULE],
      ['場所', 'あいち海上の森センター 工作室（愛知県瀬戸市吉野町304-1）']
    ];
    items.forEach(([t, body]) => {
      const h = document.createElement('h3');
      h.textContent = t;
      const p = document.createElement('p');
      p.textContent = body;
      d.append(h, p);
    });
    card.appendChild(d);
    return card;
  }

  // 専用リンクがあれば申し込める画面、なければ見るだけの予定表（isPublic）
  function render(data, isPublic) {
    const box = document.getElementById('events');
    box.textContent = '';
    if (isPublic) {
      document.getElementById('hello').textContent = '開催日と、参加予定の人のニックネームを見られます。';
      box.appendChild(joinCard());
      box.appendChild(aboutCard(true));
    } else {
      renderHello(data.me);
      box.appendChild(aboutCard(false));
    }
    if (data.events.length === 0) {
      box.insertAdjacentHTML('beforeend', '<div class="msg">いま受付中の開催日はありません。</div>');
      return;
    }
    data.events.forEach(ev => {
      const card = document.createElement('section');
      card.className = 'card' + (ev.joined ? ' joined' : '') + (ev.myState === 'offered' ? ' offered' : '') + (ev.canceled ? ' canceled' : '');

      const h = document.createElement('p');
      h.className = 'date';
      h.textContent = dateLabel(ev.date);
      if (ev.canceled) h.insertAdjacentHTML('beforeend', '<span class="badge stop">中止</span>');
      else if (ev.joined) h.insertAdjacentHTML('beforeend', '<span class="badge ok">参加予定</span>');
      else if (ev.myState === 'offered') h.insertAdjacentHTML('beforeend', '<span class="badge wait">順番が来ました</span>');
      else if (ev.myState === 'waiting') h.insertAdjacentHTML('beforeend', '<span class="badge wait">キャンセル待ち ' + ev.myRank + '番目</span>');
      card.appendChild(h);

      const time = [ev.start, ev.end].filter(Boolean).join('〜');
      const meta = [time, ev.place].filter(Boolean).join('　');
      if (meta) {
        const p = document.createElement('p');
        p.className = 'meta';
        p.textContent = meta;
        card.appendChild(p);
      }
      if (ev.note) {
        const p = document.createElement('p');
        p.className = 'note';
        p.textContent = ev.note;
        card.appendChild(p);
      }

      const head = document.createElement('p');
      head.className = 'people-head';
      head.textContent = '参加予定 ' + ev.people.length + '人' + (ev.capacity ? '（定員' + ev.capacity + '人）' : '');
      card.appendChild(head);

      if (ev.people.length) {
        const ul = document.createElement('ul');
        ul.className = 'people';
        ev.people.forEach(pp => {
          const li = document.createElement('li');
          li.append(iconNode(pp.icon, pp.special), ' ' + pp.nick);
          if (ev.joined && pp.nick === data.me.nick && pp.icon === data.me.icon) li.className = 'me';
          ul.appendChild(li);
        });
        card.appendChild(ul);
      } else {
        const p = document.createElement('p');
        p.className = 'none';
        p.textContent = 'まだいません';
        card.appendChild(p);
      }

      if (ev.waiting && ev.waiting.length) {
        const wh = document.createElement('p');
        wh.className = 'people-head';
        wh.textContent = 'キャンセル待ち ' + ev.waiting.length + '人（登録の早い順）';
        const ul = document.createElement('ul');
        ul.className = 'people waiting';
        ev.waiting.forEach(pp => {
          const li = document.createElement('li');
          li.append(iconNode(pp.icon, pp.special), ' ' + pp.nick);
          ul.appendChild(li);
        });
        card.append(wh, ul);
      }

      if (ev.myState && ev.myNote) {
        const p = document.createElement('p');
        p.className = 'my-note';
        p.textContent = '運営へのひとこと：' + ev.myNote;
        card.appendChild(p);
      }

      if (!ev.canceled && !isPublic) addButtons(card, ev);
      box.appendChild(card);
    });
  }

  // 申し込み・取り消し・キャンセル待ちのボタン
  function addButtons(card, ev) {
    const button = (cls, text, onclick) => {
      const b = document.createElement('button');
      b.className = cls;
      b.textContent = text;
      b.onclick = () => onclick(b);
      card.appendChild(b);
      return b;
    };
    const noteBox = () => {
      const label = document.createElement('label');
      label.className = 'note-label';
      label.textContent = '運営へのひとこと（なくてもかまいません）';
      const note = document.createElement('textarea');
      note.className = 'note-input';
      note.maxLength = 300;
      note.placeholder = '作りたいもの、要望があればご記入ください';
      label.htmlFor = note.id = 'note-' + ev.date;
      card.append(label, note);
      return note;
    };

    if (ev.myState === 'joined') {
      button('cancel', '参加をやめる', b => {
        const msg = dateLabel(ev.date) + 'の参加をやめますか？\n\n急病などのやむを得ない場合を除き、当日のキャンセルは参加費の全額をお支払いいただきます。';
        if (confirm(msg)) send('cancel', ev.date, b);
      });
      return;
    }

    if (ev.myState === 'offered') {
      const p = document.createElement('p');
      p.className = 'offer-box';
      p.textContent = '空きが出ました。' + ev.offerUntil + ' までに、参加するかどうかを選んでください。返事がない場合は、次の人に移ります。';
      card.appendChild(p);
      button('join', '参加する', b => send('join', ev.date, b));
      button('cancel', '参加しない', b => {
        if (confirm(dateLabel(ev.date) + 'に参加しないで、次の人に順番を回しますか？')) send('decline', ev.date, b);
      });
      return;
    }

    if (ev.myState === 'waiting') {
      const p = document.createElement('p');
      p.className = 'wait-rule';
      p.textContent = ev.waitClosed
        ? 'キャンセル待ちのお知らせは、前日18時で終わりました。'
        : 'キャンセル待ちの ' + ev.myRank + '番目です。空きが出たらメールでお知らせします。メールから6時間たって返事がない場合は、次の人に移ります。';
      card.appendChild(p);
      if (ev.canJoin) button('join', '参加する', b => send('join', ev.date, b));
      button('cancel', 'キャンセル待ちをやめる', b => {
        if (confirm(dateLabel(ev.date) + 'のキャンセル待ちをやめますか？')) send('decline', ev.date, b);
      });
      return;
    }

    if (ev.canJoin) {
      const note = noteBox();
      button('join', '参加する', b => send('join', ev.date, b, note.value));
      return;
    }

    if (ev.canWait) {
      const p = document.createElement('p');
      p.className = 'wait-rule';
      p.textContent = '定員に達しています。' + WAIT_HOW;
      card.appendChild(p);
      const note = noteBox();
      button('join', 'キャンセル待ちに登録する', b => {
        if (confirm(dateLabel(ev.date) + 'のキャンセル待ちに登録しますか？\n\n空きが出たらメールでお知らせします。6時間たって返事がない場合は、次の人に移ります。')) send('wait', ev.date, b, note.value);
      });
      return;
    }

    const b = button('join', '定員に達しました', () => {});
    b.disabled = true;
  }

  // 登録していない人向けの案内と、会員登録フォームへのボタン
  function joinCard() {
    const card = document.createElement('section');
    card.className = 'card join-card';
    const h = document.createElement('h2');
    h.textContent = '参加してみませんか';
    const p = document.createElement('p');
    p.textContent = '参加の申し込みは、会員登録をすると届く専用リンクから行います。';
    const a = document.createElement('a');
    a.className = 'btn-link';
    a.href = FORM_URL;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = '会員登録をする';
    const sub = document.createElement('p');
    sub.className = 'sub';
    sub.textContent = '登録フォームが開きます。運営が確認したあと、専用リンクをメールでお送りします。';
    card.append(h, p, a, sub);
    return card;
  }

  function renderHello(me) {
    const hello = document.getElementById('hello');
    hello.textContent = '';
    const name = document.createElement('span');
    name.append(iconNode(me.icon, me.special), ' ' + me.nick + ' さん');
    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = '参加 ' + me.count + '回';
    const btn = document.createElement('button');
    btn.className = 'icon-btn';
    btn.textContent = 'アイコンを変える';
    btn.onclick = () => togglePicker(me);
    hello.append(name, count, btn);
  }

  function togglePicker(me) {
    const box = document.getElementById('picker');
    if (!box.hidden) { box.hidden = true; return; }
    box.textContent = '';
    if (me.special) {
      const b = document.createElement('button');
      b.appendChild(iconNode(SPECIAL, me.special));
      if (me.icon === SPECIAL) b.className = 'current';
      b.onclick = () => changeIcon(SPECIAL);
      box.appendChild(b);
    }
    ICONS.slice(0, me.maxIcon).forEach((ic, i) => {
      const b = document.createElement('button');
      b.textContent = ic;
      if (i + 1 === me.icon) b.className = 'current';
      b.onclick = () => changeIcon(i + 1);
      box.appendChild(b);
    });
    if (me.nextStep > 0) {
      const p = document.createElement('p');
      p.className = 'hint';
      p.textContent = 'あと' + me.nextStep + '回の参加で、選べる絵柄が増えます。';
      box.appendChild(p);
    }
    box.hidden = false;
  }

  async function changeIcon(n) {
    const box = document.getElementById('picker');
    box.querySelectorAll('button').forEach(b => b.disabled = true);
    try {
      const data = await call({ action: 'setIcon', icon: n });
      box.hidden = true;
      if (!data.ok) { showMessage(ERRORS[data.error] || ERRORS.bad_request, true); return; }
      showMessage('アイコンを変えました。');
      render(data);
    } catch (e) {
      box.hidden = true;
      showMessage('通信できませんでした。電波の良いところで開き直してください。', true);
    }
  }

  async function send(action, date, btn, note) {
    document.querySelectorAll('button').forEach(b => b.disabled = true);
    btn.textContent = '送信中…';
    try {
      const data = await call({ action: action, date: date, note: note || '' });
      if (!data.ok) {
        showMessage(ERRORS[data.error] || ERRORS.bad_request, true);
        load();
        return;
      }
      const done = {
        join: 'に参加を受け付けました。',
        cancel: 'の参加をやめました。',
        wait: 'のキャンセル待ちに登録しました。',
        decline: 'のキャンセル待ちをやめました。'
      };
      showMessage(dateLabel(date) + done[action]);
      render(data);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      showMessage('通信できませんでした。電波の良いところで開き直してください。', true);
      load();
    }
  }

  async function load() {
    if (!token) {
      try {
        const data = await call({ action: 'public' });
        if (!data.ok) { document.getElementById('hello').textContent = ''; showMessage(ERRORS.bad_request, true); return; }
        render(data, true);
      } catch (e) {
        document.getElementById('hello').textContent = '';
        showMessage('通信できませんでした。電波の良いところで開き直してください。', true);
      }
      return;
    }
    try {
      const data = await call({ action: 'list' });
      if (!data.ok) {
        document.getElementById('hello').textContent = '';
        showMessage(ERRORS[data.error] || ERRORS.bad_request, true);
        return;
      }
      render(data);
    } catch (e) {
      showMessage('通信できませんでした。電波の良いところで開き直してください。', true);
    }
  }

  load();
</script>
</body>
</html>
