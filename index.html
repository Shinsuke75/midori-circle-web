<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>みどりの工作室 サークル活動</title>
<style>
  :root {
    --bg: #f6f4ee;
    --card: #ffffff;
    --ink: #2b2b26;
    --sub: #6b6a60;
    --green: #3f6b3a;
    --green-soft: #e6efe3;
    --line: #dedad0;
    --warn: #a4442f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    font-size: 18px;
    line-height: 1.6;
  }
  header {
    background: var(--green);
    color: #fff;
    padding: 16px 16px 14px;
  }
  header .inner { max-width: 528px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .04em; }
  header p { margin: 4px 0 0; font-size: 15px; opacity: .9; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  .msg { padding: 14px 16px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); margin-bottom: 16px; }
  .msg.err { border-color: var(--warn); color: var(--warn); }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card.joined { border: 2px solid var(--green); }
  .card.canceled { opacity: .6; }
  .date { font-size: 22px; font-weight: 700; margin: 0; }
  .meta { color: var(--sub); font-size: 16px; margin: 2px 0 0; }
  .note { margin: 8px 0 0; font-size: 16px; }
  .people-head { margin: 14px 0 6px; font-size: 15px; color: var(--sub); }
  .people { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .people li {
    background: var(--green-soft);
    border-radius: 999px;
    padding: 3px 12px 3px 8px;
    font-size: 16px;
    white-space: nowrap;
  }
  .people li.me { outline: 2px solid var(--green); }
  .none { color: var(--sub); font-size: 15px; }
  .badge {
    display: inline-block;
    font-size: 14px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 999px;
    margin-left: 8px;
    vertical-align: 3px;
  }
  .badge.ok { background: var(--green); color: #fff; }
  .badge.stop { background: var(--warn); color: #fff; }
  button {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    font-size: 19px;
    font-weight: 700;
    border-radius: 12px;
    border: 2px solid var(--green);
    cursor: pointer;
    font-family: inherit;
  }
  button.join { background: var(--green); color: #fff; }
  button.cancel { background: #fff; color: var(--green); font-size: 16px; padding: 10px; }
  button:disabled { opacity: .5; cursor: default; }
  footer { text-align: center; color: var(--sub); font-size: 13px; padding: 8px 16px 32px; }
</style>
</head>
<body>
<header>
  <div class="inner">
    <h1>みどりの工作室 サークル活動</h1>
    <p id="hello">読み込み中…</p>
  </div>
</header>
<main>
  <div id="message" class="msg" hidden></div>
  <div id="events"></div>
</main>
<footer>みどりの工作室</footer>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzIkuLTYXdUmitcjlAZFayt67q8Q4vD7xNmYVSpo0JZHNm2M1TR9MYS8iZ4IUN6Mw/exec';
  const ICONS = ['🌲', '🪵', '🍄', '🐿️', '🦉', '🌰', '🍃', '🐦', '🦔', '🌻'];
  const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
  const ERRORS = {
    invalid_link: 'このリンクは使えません。運営の人に新しいリンクをもらってください。',
    full: '定員に達したため、参加できませんでした。',
    canceled: 'この日は中止になりました。',
    past: 'この日はもう終わっています。',
    no_event: 'この日の予定が見つかりません。',
    busy: '混み合っています。少し待ってから、もう一度押してください。',
    bad_request: 'うまく送れませんでした。もう一度開き直してください。'
  };

  const token = getToken();

  function getToken() {
    const m = location.hash.match(/t=([0-9a-f]{32,128})/);
    if (m) {
      try { localStorage.setItem('midori_token', m[1]); } catch (e) {}
      return m[1];
    }
    try { return localStorage.getItem('midori_token'); } catch (e) { return null; }
  }

  function showMessage(text, isError) {
    const el = document.getElementById('message');
    el.textContent = text;
    el.className = 'msg' + (isError ? ' err' : '');
    el.hidden = !text;
  }

  async function call(body) {
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(Object.assign({ token: token }, body)) });
    return res.json();
  }

  function dateLabel(key) {
    const [y, m, d] = key.split('-').map(Number);
    const w = new Date(y, m - 1, d).getDay();
    return m + '月' + d + '日（' + WEEK[w] + '）';
  }

  function icon(n) { return ICONS[(n - 1) % ICONS.length] || ICONS[0]; }

  function render(data) {
    document.getElementById('hello').textContent = icon(data.me.icon) + ' ' + data.me.nick + ' さん';
    const box = document.getElementById('events');
    box.textContent = '';
    if (data.events.length === 0) {
      box.innerHTML = '<div class="msg">いま受付中の開催日はありません。</div>';
      return;
    }
    data.events.forEach(ev => {
      const card = document.createElement('section');
      card.className = 'card' + (ev.joined ? ' joined' : '') + (ev.canceled ? ' canceled' : '');

      const h = document.createElement('p');
      h.className = 'date';
      h.textContent = dateLabel(ev.date);
      if (ev.canceled) h.insertAdjacentHTML('beforeend', '<span class="badge stop">中止</span>');
      else if (ev.joined) h.insertAdjacentHTML('beforeend', '<span class="badge ok">参加予定</span>');
      card.appendChild(h);

      const time = [ev.start, ev.end].filter(Boolean).join('〜');
      const meta = [time, ev.place].filter(Boolean).join('　');
      if (meta) {
        const p = document.createElement('p');
        p.className = 'meta';
        p.textContent = meta;
        card.appendChild(p);
      }
      if (ev.note) {
        const p = document.createElement('p');
        p.className = 'note';
        p.textContent = ev.note;
        card.appendChild(p);
      }

      const head = document.createElement('p');
      head.className = 'people-head';
      head.textContent = '参加予定 ' + ev.people.length + '人' + (ev.capacity ? '（定員' + ev.capacity + '人）' : '');
      card.appendChild(head);

      if (ev.people.length) {
        const ul = document.createElement('ul');
        ul.className = 'people';
        ev.people.forEach(pp => {
          const li = document.createElement('li');
          li.textContent = icon(pp.icon) + ' ' + pp.nick;
          if (ev.joined && pp.nick === data.me.nick && pp.icon === data.me.icon) li.className = 'me';
          ul.appendChild(li);
        });
        card.appendChild(ul);
      } else {
        const p = document.createElement('p');
        p.className = 'none';
        p.textContent = 'まだいません';
        card.appendChild(p);
      }

      if (!ev.canceled) {
        const full = ev.capacity && ev.people.length >= ev.capacity && !ev.joined;
        const btn = document.createElement('button');
        if (ev.joined) {
          btn.className = 'cancel';
          btn.textContent = '参加をやめる';
          btn.onclick = () => {
            if (confirm(dateLabel(ev.date) + 'の参加をやめますか？')) send('cancel', ev.date, btn);
          };
        } else {
          btn.className = 'join';
          btn.textContent = full ? '定員に達しました' : '参加する';
          btn.disabled = !!full;
          btn.onclick = () => send('join', ev.date, btn);
        }
        card.appendChild(btn);
      }
      box.appendChild(card);
    });
  }

  async function send(action, date, btn) {
    document.querySelectorAll('button').forEach(b => b.disabled = true);
    btn.textContent = '送信中…';
    try {
      const data = await call({ action: action, date: date });
      if (!data.ok) {
        showMessage(ERRORS[data.error] || ERRORS.bad_request, true);
        load();
        return;
      }
      showMessage(action === 'join' ? dateLabel(date) + 'に参加を受け付けました。' : dateLabel(date) + 'の参加をやめました。');
      render(data);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      showMessage('通信できませんでした。電波の良いところで開き直してください。', true);
      load();
    }
  }

  async function load() {
    if (!token) {
      document.getElementById('hello').textContent = '';
      showMessage('このページは、配られた専用リンクかQRコードから開いてください。', true);
      return;
    }
    try {
      const data = await call({ action: 'list' });
      if (!data.ok) {
        document.getElementById('hello').textContent = '';
        showMessage(ERRORS[data.error] || ERRORS.bad_request, true);
        return;
      }
      render(data);
    } catch (e) {
      showMessage('通信できませんでした。電波の良いところで開き直してください。', true);
    }
  }

  load();
</script>
</body>
</html>
