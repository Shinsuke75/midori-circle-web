<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みどりサークル 動作確認</title>
<style>
  body { font-family: sans-serif; margin: 24px; line-height: 1.7; }
  #result { padding: 12px; background: #eef5ee; border-radius: 8px; }
</style>
</head>
<body>
<h1>みどりサークル 動作確認</h1>
<p>このページはGitHub Pagesに置いています。下に「GASから届きました」と出れば成功です。</p>
<div id="result">読み込み中…</div>
<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzIkuLTYXdUmitcjlAZFayt67q8Q4vD7xNmYVSpo0JZHNm2M1TR9MYS8iZ4IUN6Mw/exec';
  fetch(GAS_URL)
    .then(r => r.json())
    .then(d => { document.getElementById('result').textContent = d.message + '（' + d.time + '）'; })
    .catch(e => { document.getElementById('result').textContent = '読み込めませんでした：' + e; });
</script>
</body>
</html>
